# Xiaomi Redmi 9: values checked against the running Android FDT (2026-10-22).
NAME="Xiaomi Redmi 9 (lancelot)"
SOC="MediaTek MT6768 / MT6769T, 6x Cortex-A55 + 2x Cortex-A75"
KIND=phone
BOOT_METHOD=efi-file
UEFI_TARGET=lancelot
FB_BASE=0x7cdb0000
WIFI_ATH11K=0
BOOTARGS="-v cpus=1 touchscreen=0 gpu=0 wifi=0 adsp=0"
DEFAULT_SECS=30
USERLAND_VARS="PREBUILT=1 REST=1"
FIRMWARE=""
# UEFI is the existing MTK port. Do not package Qualcomm BootShim/FD/DTB defaults.
# Build the ESP loader/payload with common/build-lancelot.sh.
